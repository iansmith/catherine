system = "github"
key    = "iansmith/catherine"
prefix = "CATH"

# Project-local ticket tracking. The historical defaults live under ~/.claude, which is
# a protected path: a headless fleet agent's Write tool refuses it even when the launch
# passes a matching --add-dir. Relative paths resolve from the main worktree root, so
# every agent worktree shares these two dirs. `.slopstop/` is gitignored.
tracking_dir = ".slopstop/ticket-active"
archive_dir  = ".slopstop/ticket-archive"

[status_labels]
in_progress = "status:in-progress"
# 3-state workflow: no in_review label.
# Add  in_review = "status:in-review"  here to upgrade to 4-state.

# PR review backend.
# Omit this block entirely to use CodeRabbit (default).
# Without CodeRabbit installed AND without backend = "claude", no review runs.
[pr_review]
backend = "claude"
effort  = "high"   # low | medium | high | max | ultra
# fix     = false    # true: commit fixable findings after code-review completes   # retired v4.0.0

[workflow]
skip_confirm = true

[tiers.huge]  # set 2026-08-01 (grand synchronization)
provider = "anthropic"
model    = "opus"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"

[tiers.large]  # set 2026-08-01 (grand synchronization)
provider = "anthropic"
model    = "opus"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"

[tiers.medium]  # set 2026-08-01 (grand synchronization)
provider = "anthropic"
model    = "sonnet"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"

[tiers.small]  # set 2026-08-01 (grand synchronization)
provider = "anthropic"
model    = "sonnet"
effort   = "high"  # set 2026-08-07 (fleet sync)
version  = "5"

# [autonomous]  # set 2026-08-01 (grand synchronization)   # retired v4.0.0
# enabled = true   # retired v4.0.0
